name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/uda-server

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Quality stages are non-blocking for now (tests/lint still being stabilized).
  # They run and surface results without stopping the build+dispatch pipeline.
  # Remove continue-on-error once the suite is green to make them gating.
  # --------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder (no lint configured yet)
        run: echo "Lint/static-analysis to be wired in a future change."

  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests (non-blocking)
        run: ./gradlew test --no-daemon --stacktrace || echo "::warning::tests failed (non-blocking)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build + publish image
    needs: [lint, test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
      env_name: ${{ steps.meta.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build Quarkus fast-jar
        run: ./gradlew clean build -x test --no-daemon --stacktrace

      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          sha_short="${GITHUB_SHA:0:7}"
          case "${GITHUB_REF_NAME}" in
            dev)       env_name=dev ;;
            main)      env_name=stage ;;
            *)         env_name="${GITHUB_REF_NAME//\//-}" ;;
          esac
          echo "env_name=$env_name"                           >> "$GITHUB_OUTPUT"
          echo "tag=${env_name}-${sha_short}"                 >> "$GITHUB_OUTPUT"
          echo "latest_tag=${env_name}-latest"                >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose immutable image ref
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: ref
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "$DIGEST" ]]; then
            echo "::error::build-push-action produced no digest (image was not pushed)"
            exit 1
          fi
          REF="${IMAGE_REPO}@${DIGEST}"
          echo "image_ref=${REF}" >> "$GITHUB_OUTPUT"
          {
            echo "## Image published"
            echo "- \`${REF}\`"
            echo "- Also tagged: \`${IMAGE_REPO}:${{ steps.meta.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch:
    name: Trigger release-bump in udan-infra
    needs: build
    if: >-
      github.event_name == 'push'
      && (github.ref_name == 'dev' || github.ref_name == 'main')
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch (release-bump)
        env:
          TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          ENV_NAME: ${{ needs.build.outputs.env_name }}
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "::error::INFRA_DISPATCH_TOKEN is not set on this repo. Create a fine-grained PAT (Contents: Read and write on pasagadisriram/udan-infra only), then:"
            echo "::error::  gh secret set INFRA_DISPATCH_TOKEN --repo ${{ github.repository }} --body '<token>'"
            echo "::error::Docs: https://github.com/pasagadisriram/udan-infra/blob/dev/docs/runbooks/app-repo-pat-setup.md"
            exit 1
          fi
          if [[ -z "$IMAGE_REF" || "$IMAGE_REF" != *"@sha256:"* ]]; then
            echo "::error::image_ref output missing or malformed: '$IMAGE_REF'"
            exit 1
          fi
          payload=$(jq -cn --arg svc server --arg env "$ENV_NAME" --arg img "$IMAGE_REF" \
            '{event_type:"release-bump", client_payload:{service:$svc, env:$env, image:$img}}')
          echo "Dispatching: $payload"
          http_code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload" \
            https://api.github.com/repos/pasagadisriram/udan-infra/dispatches)
          if [[ "$http_code" != "204" ]]; then
            echo "::error::dispatch failed (HTTP $http_code)"
            cat /tmp/resp.txt
            exit 1
          fi
          {
            echo "## Dispatched release-bump"
            echo "- env: \`$ENV_NAME\`"
            echo "- image: \`$IMAGE_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
